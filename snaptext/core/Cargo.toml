[package]
name = "snaptext-core"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
sysinfo = "0.32"
arboard = "3.6"
xcap = "0.9"
printpdf = { version = "0.7", features = ["embedded_images"] }
global-hotkey = "0.6"
ureq = { version = "2", default-features = false, features = ["tls"] }
sha2 = "0.10"
hex = "0.4"
ort = "2.0.0-rc.14"
ndarray = "0.16"
