[package]
name = "thekvm-setup"
version = "0.1.3"
edition = "2021"

# Intentionally outside the main workspace: this is a build-time packaging
# step, not a shipped crate.
[workspace]

[[bin]]
name = "thekvm-setup"
path = "src/main.rs"

[dependencies]
slint = "1.8"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
