[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snaptext"
version = "0.1.0"
description = "On-device screenshot OCR/VLM: overlay PDF + auto-copy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mss", "Pillow", "pyperclip", "psutil", "rapidocr", "onnxruntime", "reportlab", "numpy"]

[project.scripts]
snaptext = "snaptext.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
