# Super+S then C — compositor binds (v1)

## Hyprland — ~/.config/hypr/snaptext.conf
bind = SUPER, S, exec, snaptext capture --interactive --mode auto --copy --pdf /tmp/snap-$(date +%s).pdf
# pencil: B inside selector · confirm: Enter · cancel: Esc

## GNOME (gsettings)
# Settings > Keyboard > View and Customise Shortcuts > Custom:
#   Name: SnapText  Command: snaptext capture --interactive --mode auto --copy  Shortcut: Super+S

## KDE Spectacle-style
# Custom Shortcuts > snaptext capture --interactive --mode auto --copy (Meta+S)

## XFCE4
# xfconf-query -c xfce4-keyboard-shortcuts -p /commands/custom/'Super+s' -n -t string -s 'snaptext capture --interactive --mode auto --copy'

## X11 generic / désiré Super+S+C sequence
# snaptext listen  (pynput: Super+S arms, C fires) + autostart desktop file below.

## autostart/snaptext-listen.desktop
[Desktop Entry]
Type=Application
Name=SnapText hotkey
Exec=snaptext listen
X-GNOME-Autostart-enabled=true
