[package]
name = "kvm-ui"
version.workspace = true
edition.workspace = true

[[bin]]
name = "kvm-ui"
path = "src/main.rs"

[dependencies]
kvm-core = { path = "../kvm-core" }
kvm-protocol = { path = "../kvm-protocol" }
kvm-platform = { path = "../kvm-platform" }
qrcode = "0.14"
# tiny-skia (software) renderer only: the GL/femtovg default pulls
# Mesa + libLLVM (~32 MB RSS) on Linux-X11 and is useless on machines
# without OpenGL. Every slint primitive this UI uses renders identically
# in software. Accessibility, system tray support and compat-1-2 stay.
slint = { version = "1.8", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-software",
    "accessibility",
    "compat-1-2",
    "system-tray",
] }
tray-icon = "0.2"
tokio = { workspace = true }
quinn = { workspace = true }
rustls-pki-types = "1"
sha2 = "0.10"
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# glibc malloc strands freed arena pages on Linux (VmRSS >> live set,
# measured 15+ MB). mimalloc returns them promptly there. Windows uses the
# OS allocator: full crash dumps showed kvm-ui dying for hours on end
# inside mimalloc's metadata walk (a -1 next-pointer read in
# mi_find_free_page), on both the v2 and v3 lines. Keeping mimalloc
# Linux-only preserves the memory win where it helps without the crash.
# Pinned: 0.1.49+ switched to mimalloc v3.3.x.
mimalloc = "=0.1.48"
gtk = "0.15"
# Activation (_NET_ACTIVE_WINDOW) of our window when the Linux tray menu's
# "Show" is clicked: raises the window to the foreground instead of opening
# it behind whatever is active.
x11rb = { version = "0.13", default-features = false }
# The supervised child must die with this process (PR_SET_PDEATHSIG) even
# when the app is SIGKILLed from a terminal or the process monitor.
libc = "0.2"

[build-dependencies]
slint-build = "1.8"

[target.'cfg(target_os = "windows")'.dependencies]
# The tray thread must pump this thread's Win32 message queue itself
# (tray-icon delivers clicks/menu commands through a hidden window there).
# The job object kills every supervised child when this process dies for
# any reason, including a Task Manager kill that runs no cleanup code.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winres = "0.1"
