name: Release binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    env:
      # Release linking (Skia/static) is memory-hungry; stay well clear of
      # the runner's RAM ceiling instead of failing fast on a cold cache.
      CARGO_BUILD_JOBS: 2
      # Cap native build parallelism too (Skia build scripts otherwise use
      # every core regardless of cargo's -j).
      NUM_JOBS: 2
      JOBS: 2
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      # Trade a little binary size/speed for link-time memory: the default
      # workspace profile (thin LTO, single codegen unit) peaks far above
      # what the hosted runner reliably provides.
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      # No debuginfo during the link: strip already removes it from the
      # output, but generating it costs link-time RAM for nothing.
      CARGO_PROFILE_RELEASE_DEBUG: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/lib/jvm /usr/local/lib/node_modules \
            /opt/az 2>/dev/null || true
          sudo docker system prune -af 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          df -h /
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libdbus-1-dev libfontconfig1-dev libgtk-3-dev libayatana-appindicator3-dev \
            libinput-dev libwayland-dev libx11-xcb-dev libxdo-dev \
            libxi-dev libxkbcommon-dev libxtst-dev pkg-config
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-x86_64-release
      - name: Add swap for the Skia link
        # Best-effort only: this step must NEVER fail the release. Root cause
        # of the previous red runs: `fallocate` creates a sparse file, which
        # `mkswap` rejects ("swapfile has holes"), and under `bash -e` that
        # single failure killed the whole Linux job in ~2s. Fix: `dd`
        # (non-sparse) on /mnt (the runner's large data disk, not the small
        # root disk), with every failure degrading to a warning + exit 0.
        run: |
          set +e
          echo "=== swap setup (best-effort) ==="
          df -h / /mnt || true
          free -h || true
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile || true
          SWAPFILE=/mnt/swapfile
          sudo dd if=/dev/zero of="$SWAPFILE" bs=1M count=4096 status=none
          if [ $? -ne 0 ]; then
            echo "4G swap did not fit; trying 2G..."
            sudo rm -f "$SWAPFILE" || true
            sudo dd if=/dev/zero of="$SWAPFILE" bs=1M count=2048 status=none
            if [ $? -ne 0 ]; then
              echo "::warning::swap unavailable (disk full); continuing with profile caps only"
              sudo rm -f "$SWAPFILE" || true
              exit 0
            fi
          fi
          sudo chmod 600 "$SWAPFILE" || true
          sudo mkswap "$SWAPFILE" || {
            echo "::warning::mkswap failed; continuing without extra swap"
            sudo rm -f "$SWAPFILE" || true
            exit 0
          }
          sudo swapon "$SWAPFILE" || {
            echo "::warning::swapon not permitted on this runner; continuing without extra swap"
            sudo rm -f "$SWAPFILE" || true
            exit 0
          }
          echo "=== swap active ==="
          free -h || true
          exit 0
      - name: Build daemon (release)
        run: cargo build --release -p kvm-daemon
      - name: Build UI (release)
        run: cargo build --release -p kvm-ui
      - name: Build .deb
        run: |
          VER="${GITHUB_REF_NAME#v}"
          sed -i "s/^VER=.*/VER=$VER/" packaging/linux/build-deb.sh
          grep "^VER=" packaging/linux/build-deb.sh
          mkdir -p ~/thekvm-build/in
          cp target/release/kvm-daemon target/release/kvm-ui ~/thekvm-build/in/
          sudo bash packaging/linux/build-deb.sh
          ls -la ~/thekvm-build/*.deb
      - name: Build portable tarball
        run: |
          VER="${GITHUB_REF_NAME#v}"
          STAGE="thekvm-$VER-linux-x86_64"
          mkdir -p "$STAGE"
          cp target/release/kvm-daemon target/release/kvm-ui "$STAGE/"
          cp packaging/linux/install.sh packaging/linux/99-thekvm-uinput.rules \
             packaging/linux/thekvm.conf packaging/linux/thekvmd.service \
             packaging/linux/thekvm-agent.service packaging/linux/thekvm-agent-user.service "$STAGE/"
          tar czf "$STAGE.tar.gz" "$STAGE"
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            ~/thekvm-build/*.deb
            thekvm-*-linux-x86_64.tar.gz

  windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-x86_64-release
      - name: Build release binaries
        run: cargo build --release -p kvm-daemon -p kvm-ui
      - name: Zip portable build
        shell: pwsh
        run: |
          $Ver = "${{ github.ref_name }}".TrimStart("v")
          $Stage = "thekvm-$Ver-windows-x86_64"
          New-Item -ItemType Directory -Path $Stage | Out-Null
          Copy-Item target/release/kvm-daemon.exe, target/release/kvm-ui.exe $Stage/
          Copy-Item packaging/windows/install-service.ps1 $Stage/ -ErrorAction SilentlyContinue
          Compress-Archive -Path "$Stage/*" -DestinationPath "$Stage.zip"
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: thekvm-*-windows-x86_64.zip

  publish:
    name: Publish GitHub Release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
