name: TheKVM CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows native
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run workspace tests
        run: cargo test --workspace
      - name: Run strict Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build release binaries
        run: cargo build --workspace --release
      - name: Run isolated LAN integration
        shell: pwsh
        run: ./tools/lan-integration.ps1

  linux:
    name: Linux native
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install native capture/UI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libdbus-1-dev libinput-dev libwayland-dev libx11-xcb-dev \
            libxi-dev libxkbcommon-dev libxtst-dev pkg-config
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Run workspace tests
        run: cargo test --workspace
      - name: Run strict Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build release binaries
        run: cargo build --workspace --release
      - name: Run isolated Unix LAN integration
        run: sh tools/lan-integration.sh

  cross-platform:
    name: Cross-target platform checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-musl,x86_64-unknown-freebsd
      - name: Check ARM64 Linux platform backend
        env:
          RUSTFLAGS: --cfg libei
        run: cargo check -p kvm-platform --tests --target aarch64-unknown-linux-musl
      - name: Check FreeBSD platform backend
        run: cargo check -p kvm-platform --tests --target x86_64-unknown-freebsd
