[workspace]
resolver = "2"
members = [
    "kvm-core",
    "kvm-protocol",
    "kvm-platform",
    "kvm-daemon",
    "kvm-ui",
    "kvm-android",
]

[workspace.package]
version = "0.9.98"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rcgen = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

[profile.release]
# Whole-program LTO + single codegen unit: smaller binaries (better
# startup, less file-backed RSS on every launch). LTO pays the compile
# time once per release instead of per run — the right trade.
lto = "fat"
codegen-units = 1
strip = true
